<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../Design/style.css">
  <script src="../JS/app.js"></script>
</head>
<body class="admin">

  <nav class="navbar">
    <a href="dashboard.html" class="brand">NGO Admin</a>
    <ul class="nav-links">
      <li><a href="volunteers.html">Volunteer Management</a></li>
      <li><a href="organizations.html">Organization Management</a></li>
      <li><a href="events.html">Event Management</a></li>
      <li><a href="notices.html">Notice Board</a></li>
    </ul>
    <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
  </nav>

  <main class="container">
    <h1>Welcome, Admin</h1>
    <p class="subtitle">Pick a section from the menu above or use the shortcuts below.</p>

    <div class="summary-grid">
      <a href="volunteers.html" class="card summary-card">
        <div class="number" id="volCount">0</div>
        <div>Volunteers</div>
      </a>
      <a href="organizations.html" class="card summary-card">
        <div class="number" id="orgCount">0</div>
        <div>Organizations</div>
      </a>
      <a href="events.html" class="card summary-card">
        <div class="number" id="eventCount">0</div>
        <div>Events</div>
      </a>
      <a href="notices.html" class="card summary-card">
        <div class="number" id="noticeCount">0</div>
        <div>Notices</div>
      </a>
    </div>
  </main>

  <script src="../JS/dashboard.js"></script>

</body>
</html>
