<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin">

  <nav class="navbar">
    <a href="dashboard.html" class="brand">NGO Admin</a>
    <ul class="nav-links">
      <li><a href="volunteers.html" class="active">Volunteer Management</a></li>
      <li><a href="organizations.html">Organization Management</a></li>
      <li><a href="events.html">Event Management</a></li>
      <li><a href="notices.html">Notice Board</a></li>
    </ul>
    <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
  </nav>

  <main class="container">
    <h1>Volunteer Management</h1>
    <p class="subtitle">Add, view and remove volunteers.</p>

    <div id="message" class="message"></div>

    <section class="card">
      <h2>Add Volunteer</h2>
      <div class="form-grid">
        <div>
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter full name">
        </div>
        <div>
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" placeholder="e.g. 01712-345678">
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter email">
        </div>
      </div>
      <button type="button" id="addBtn" class="btn">Add Volunteer</button>
    </section>

    <section class="card">
      <h2>All Volunteers (<span id="count">0</span>)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="volunteers.js"></script>

</body>
</html>
